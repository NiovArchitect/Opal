services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opal_core_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - opal_net
    volumes:
      - opal_pg_data:/var/lib/postgresql/data

  opal_ai:
    build:
      context: ../..
      dockerfile: services/opal_ai/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - opal_net

  opal_core:
    build:
      context: ../..
      dockerfile: apps/opal_core/Dockerfile
    environment:
      DATABASE_URL: ecto://postgres:postgres@postgres/opal_core_dev
      OPAL_AI_URL: http://opal_ai:8000
      PHX_SERVER: "true"
      PORT: "4000"
      SECRET_KEY_BASE: "local-dev-secret-key-base-not-for-production-use-32b+"
      MIX_ENV: dev
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      opal_ai:
        condition: service_healthy
    networks:
      - opal_net

networks:
  opal_net:
    driver: bridge

volumes:
  opal_pg_data:
