services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opal_core_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - opal_net
    volumes:
      - opal_pg_data:/var/lib/postgresql/data

  # P4.1 — Kafka-protocol local broker (Redpanda). Not production. Not source of truth.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://127.0.0.1:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.+true' || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - opal_net

  opal_ai:
    build:
      context: ../..
      dockerfile: services/opal_ai/Dockerfile
    environment:
      OPAL_AI_DEBUG: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - opal_net

  opal_core:
    build:
      context: ../..
      dockerfile: apps/opal_core/Dockerfile
    environment:
      DATABASE_URL: ecto://postgres:postgres@postgres/opal_core_dev
      OPAL_AI_URL: http://opal_ai:8000
      OPAL_AI_CLIENT: http
      OPAL_DEV_AUTH: "true"
      OPAL_EVENT_PROBE: "true"
      OPAL_DOCKER: "true"
      PHX_SERVER: "true"
      PORT: "4000"
      MIX_ENV: dev
      SECRET_KEY_BASE: "local-dev-secret-key-base-not-for-production-use-32b-minimum"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      opal_ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:4000/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
    networks:
      - opal_net

networks:
  opal_net:
    driver: bridge

volumes:
  opal_pg_data:
