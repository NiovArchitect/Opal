<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Opal orb">
  <!-- Repair #18 Orb System: vector REDUCTION of the founder's orb master.
       Geometry measured by scripts/orb/sample_masters.py (sphere 101,100 r51;
       ring r71; horizontal ring cy106 rx86 ry11, master x0.125). Gradient stops
       are the sampled fire sector peaks. Hero sizes use the master itself
       (opal-orb-hero.webp), never this reduction. -->
  <defs>
    <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d4dce"/>
      <stop offset="34%" stop-color="#6257c7"/>
      <stop offset="58%" stop-color="#60b9d8"/>
      <stop offset="80%" stop-color="#d972c2"/>
      <stop offset="100%" stop-color="#f1aa62"/>
    </linearGradient>
    <radialGradient id="core" cx="0.62" cy="0.6" r="0.75">
      <stop offset="0%" stop-color="#fedc9a"/>
      <stop offset="45%" stop-color="#f1aa62" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f1aa62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbae8e"/>
      <stop offset="52%" stop-color="#ffeac9"/>
      <stop offset="100%" stop-color="#dbae8e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="sphere-clip">
      <circle cx="101" cy="100" r="51"/>
    </clipPath>
  </defs>
  <ellipse cx="101" cy="106" rx="86" ry="11" fill="none" stroke="url(#metal)" stroke-width="2.4"/>
  <circle cx="101" cy="100" r="51" fill="url(#fire)"/>
  <g clip-path="url(#sphere-clip)" filter="url(#soft)">
    <ellipse cx="74" cy="134" rx="34" ry="24" fill="#7d4dce" opacity="0.75"/>
    <ellipse cx="128" cy="66" rx="32" ry="20" fill="#60b9d8" opacity="0.65"/>
    <ellipse cx="142" cy="122" rx="18" ry="26" fill="#d972c2" opacity="0.5"/>
    <ellipse cx="122" cy="138" rx="26" ry="16" fill="#f1aa62" opacity="0.65"/>
  </g>
  <circle cx="101" cy="100" r="51" fill="url(#core)"/>
  <ellipse cx="84" cy="72" rx="26" ry="15" fill="#ffffff" opacity="0.10"/>
  <circle cx="101" cy="100" r="71" fill="none" stroke="url(#metal)" stroke-width="2.4"/>
  <g fill="#fff1d0">
    <circle cx="101" cy="29" r="2.6"/>
    <circle cx="151" cy="50" r="2.6"/>
    <circle cx="187" cy="106" r="2.6"/>
    <circle cx="101" cy="171" r="2.6"/>
    <circle cx="51" cy="150" r="2.6"/>
    <circle cx="15" cy="106" r="2.6"/>
  </g>
</svg>
