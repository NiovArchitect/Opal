name: Deploy Opal API (Render image)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag prefix"
        required: true
        default: "sf17-main"
      make_public:
        description: "Set GHCR package public so Render can pull without credentials"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          # Use a package name not auto-linked as a private-repo-only package so
          # founder-authorized public visibility can work for Render free-tier pull.
          PKG=opal-api-runtime
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${OWNER_LC}/${PKG}:${{ inputs.image_tag }}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ghcr_sha=ghcr.io/${OWNER_LC}/${PKG}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build production image
        run: |
          docker build -f apps/opal_core/Dockerfile.prod \
            -t "${{ steps.meta.outputs.ghcr }}" \
            -t "${{ steps.meta.outputs.ghcr_sha }}" \
            .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (durable)
        id: ghcr_push
        run: |
          set -euo pipefail
          docker push "${{ steps.meta.outputs.ghcr }}"
          docker push "${{ steps.meta.outputs.ghcr_sha }}"
          # RepoDigests may be empty until re-inspect after push
          docker pull "${{ steps.meta.outputs.ghcr }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.ghcr }}" | awk -F@ '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.meta.outputs.ghcr }}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${{ steps.meta.outputs.ghcr }} digest=${DIGEST}"

      # Founder-authorized alternate path: public package (compiled app only; no runtime secrets).
      # Preferred long-term: private package + Render registry credential with packages:read.
      - name: Set GHCR package visibility public
        if: ${{ inputs.make_public == true || inputs.make_public == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG="${{ steps.meta.outputs.pkg }}"
          OWNER="${{ github.repository_owner }}"
          # Unlinked user package can be public even when the monorepo is private.
          for url in \
            "https://api.github.com/user/packages/container/${PKG}" \
            "https://api.github.com/users/${OWNER}/packages/container/${PKG}"
          do
            echo "PATCH $url"
            curl -sS -X PATCH "$url" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"visibility":"public"}' | head -c 400
            echo
          done
          # Explicit visibility endpoint
          curl -sS -X PUT \
            "https://api.github.com/user/packages/container/${PKG}/visibility" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"visibility":"public"}' | head -c 400 || true
          echo

      - name: Verify anonymous GHCR pull (Render-like)
        id: verify_public
        continue-on-error: true
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          # Clear credentials
          rm -f ~/.docker/config.json || true
          if docker pull "${{ steps.meta.outputs.ghcr }}"; then
            echo "public_pull=true" >> "$GITHUB_OUTPUT"
            echo "Anonymous pull succeeded"
          else
            echo "public_pull=false" >> "$GITHUB_OUTPUT"
            echo "Anonymous pull failed — package still private or visibility not applied"
            exit 1
          fi

      - name: Log in to GHCR again for digest inspection
        if: always()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy even when anonymous GHCR pull fails — Render uses registryCredentialId
      # (private package + packages:read credential) as proven in SF17 durable deploy.
      - name: Update Render image path and deploy
        if: ${{ always() && steps.ghcr_push.outcome == 'success' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d9nvji3m8hqs73f60tpg
          IMAGE: ${{ steps.meta.outputs.ghcr }}
          DIGEST: ${{ steps.ghcr_push.outputs.digest }}
          REGISTRY_CREDENTIAL_ID: rgc-d9ohqc7lk1mc7397tjs0
        run: |
          set -euo pipefail
          DEPLOY_REF="${IMAGE}"
          echo "Deploying durable image: ${DEPLOY_REF}"
          echo "Digest: ${DIGEST}"
          echo "Source SHA: ${{ steps.meta.outputs.full_sha }}"
          echo "public_pull=${{ steps.verify_public.outputs.public_pull }}"
          # Keep Render registry credential so private GHCR packages pull correctly.
          RESP=$(curl -sS -X PATCH "https://api.render.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":{\"imagePath\":\"${DEPLOY_REF}\",\"registryCredentialId\":\"${REGISTRY_CREDENTIAL_ID}\"}}")
          echo "$RESP" | head -c 800
          echo
          PATH_AFTER=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("imagePath",""))')
          if [ -z "$PATH_AFTER" ]; then
            echo "ERROR: imagePath not updated: $RESP"
            exit 1
          fi
          echo "imagePath now: $PATH_AFTER"
          DEPLOY=$(curl -sS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}')
          echo "$DEPLOY"
          echo "$DEPLOY" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("id"), d'
