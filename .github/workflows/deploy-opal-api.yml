name: Deploy Opal API (Render image)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag prefix"
        required: true
        default: "sf17-main"

permissions:
  contents: read
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${OWNER_LC}/opal-api:${{ inputs.image_tag }}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ghcr_sha=ghcr.io/${OWNER_LC}/opal-api:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build production image
        run: |
          docker build -f apps/opal_core/Dockerfile.prod \
            -t "${{ steps.meta.outputs.ghcr }}" \
            -t "${{ steps.meta.outputs.ghcr_sha }}" \
            .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (durable)
        id: ghcr_push
        run: |
          docker push "${{ steps.meta.outputs.ghcr }}"
          docker push "${{ steps.meta.outputs.ghcr_sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.ghcr }}" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.meta.outputs.ghcr }}" >> "$GITHUB_OUTPUT"
          echo "Pushed digest ${DIGEST}"

      # Compiled application image only; no runtime secrets in the image.
      # Public so Render free-tier can pull without private registry credentials.
      - name: Set GHCR package visibility public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OWNER="${{ steps.meta.outputs.owner }}"
          # User-owned package path
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/opal-api" \
            -d '{"visibility":"public"}' | head -c 300
          echo
          # Org-owned package path (if applicable)
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/opal-api" \
            -d '{"visibility":"public"}' | head -c 300
          echo
          # Link package to repo for discovery
          curl -sS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/opal-api/versions" >/dev/null 2>&1 || true

      - name: Update Render image path and deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d9nvji3m8hqs73f60tpg
          IMAGE: ${{ steps.meta.outputs.ghcr }}
        run: |
          set -euo pipefail
          echo "Deploying durable image: ${IMAGE}"
          echo "Source SHA: ${{ steps.meta.outputs.full_sha }}"
          echo "Digest: ${{ steps.ghcr_push.outputs.digest }}"
          RESP=$(curl -sS -X PATCH "https://api.render.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":{\"imagePath\":\"${IMAGE}\"}}")
          echo "$RESP" | head -c 600
          echo
          PATH_AFTER=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("imagePath",""))')
          if [ "$PATH_AFTER" != "$IMAGE" ]; then
            echo "ERROR: imagePath not updated (got: $PATH_AFTER)"
            echo "full response: $RESP"
            exit 1
          fi
          DEPLOY=$(curl -sS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}')
          echo "$DEPLOY"
          echo "$DEPLOY" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("id"), d'
          echo "deploy_id=$(echo "$DEPLOY" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')" >> "$GITHUB_OUTPUT"
