name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-python:
    name: Contracts + Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/opal_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy opal_ai
      - name: Pytest
        run: pytest -q
      - name: Secret scan (basic)
        working-directory: ${{ github.workspace }}
        run: |
          if rg -n "BEGIN (RSA |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}" --glob '!**/.git/**' . ; then
            echo "Possible secrets found"
            exit 1
          fi
          echo "No obvious secrets"

  elixir:
    name: Elixir core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: opal_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/opal_core
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Deps
        run: mix deps.get
      - name: Format
        run: mix format --check-formatted
      - name: Compile warnings as errors
        run: mix compile --warnings-as-errors
      - name: Credo
        run: mix credo --strict
      - name: Tests
        env:
          MIX_ENV: test
        run: mix test
      - name: Audit (optional)
        run: mix hex.audit || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build opal_ai
        run: docker build -f services/opal_ai/Dockerfile -t opal_ai:ci .
      - name: Build opal_core
        run: docker build -f apps/opal_core/Dockerfile -t opal_core:ci .
