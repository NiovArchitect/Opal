  implementation_integrity:
    description: "Real structured UI / domain owners — not screenshot+hotspots cheat"
    required_for_surfaces:
      - global_opal
  behavior_integrity:
    description: "Routes, mutations, back behavior, hit classes"
  dynamic_content:
    description: "Live/dynamic slots not frozen fixture-only"
  accessibility_semantics:
    description: "Roles, labels, real controls vs invisible hit regions"
  domain_mutation:
    description: "Create/commit/live mutations match product law"

